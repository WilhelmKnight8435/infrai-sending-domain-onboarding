[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-onboarding"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["domain_onboarding"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
